manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: YanPelletier
      url-base: https://github.com/YanPelletier
    - name: kevinpastor
      url-base: https://github.com/kevinpastor
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-ecaps-word
      remote: YanPelletier
      revision: main
      path: modules/ecaps-word
    - name: nice-view-elemental
      remote: kevinpastor
      revision: main
      path: modules/nice-view-elemental
  self:
    path: config