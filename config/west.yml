manifest:
  defaults:
    revision: main
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: YanPelletier
      url-base: https://github.com/YanPelletier
    - name: geratrevino115
      url-base: https://github.com/geratrevino115/nice-view-battery
  projects:
    - name: zmk
      remote: zmkfirmware
      import: app/west.yml
    - name: zmk-ecaps-word
      remote: YanPelletier
      revision: main
      path: modules/ecaps-word
    - name: nice-view-battery
      remote: geratrevino115
      revision: main
      path: modules/nice-view-battery
  self:
    path: config