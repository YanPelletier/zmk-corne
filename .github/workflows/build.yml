name: Build ZMK firmware

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: zmkfirmware/zmk-dev-arm:stable

    steps:
      - name: Checkout config repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install west
        run: |
          python3 -m venv /tmp/west-venv
          /tmp/west-venv/bin/pip install --upgrade pip
          /tmp/west-venv/bin/pip install west

      - name: Initialize ZMK
        run: |
          /tmp/west-venv/bin/west init -m https://github.com/zmkfirmware/zmk.git --manifest-rev main .
          /tmp/west-venv/bin/west update

      - name: Build firmware
        run: |
          /tmp/west-venv/bin/west build -p auto -b nice_nano_v2 -- -DSHIELD="corne_left nice_view_adapter nice_view_battery" -DZMK_CONFIG=config